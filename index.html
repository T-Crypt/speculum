<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speculum — Local LLM Runtime Monitor</title>
<meta name="description" content="Mirror-glass dashboard for a local LLM runtime: live gauges, token ledger, context map, context graph, live event stream.">
<link rel="stylesheet" href="glass.css">
<link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <div class="aurora" aria-hidden="true">
    <span class="blob b1"></span>
    <span class="blob b2"></span>
    <span class="blob b3"></span>
  </div>
  <div class="grain" aria-hidden="true"></div>

  <main class="deck">
    <header class="bar glass" id="bar" aria-label="Monitor header"></header>
    <div class="alertbar glass" id="alertbar" role="alert"></div>
    <section class="kpi" id="kpi" aria-label="Live metrics"></section>
    <section class="signal glass" id="signal" aria-label="Throughput signal"></section>
    <section class="gauges glass" id="gauges" aria-label="Hardware gauges"></section>
    <section class="context glass" id="context" aria-label="Context map"></section>
    <section class="ledger glass" id="ledger" aria-label="Token ledger"></section>
    <section class="ctxgraph glass" id="ctxgraph" aria-label="Context graph"></section>
    <section class="lanes" id="lanes" aria-label="Model lanes"></section>
    <section class="stream glass" id="stream" aria-label="Event stream"></section>
    <aside class="pool glass" id="pool" aria-label="KV slot pool"></aside>
  </main>

  <p class="foot" id="foot">
    <kbd>P</kbd> pause · live feed: <code>/api/stream</code> (SSE 1 Hz) · <code>?demo</code> runs the seeded simulator
  </p>

  <script type="module" src="app.js"></script>
</body>
</html>
