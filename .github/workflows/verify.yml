name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: collector parses
        run: python3 -m py_compile collector/*.py
      - name: collector suite
        run: python3 -m unittest discover -s collector -p "test_*.py"
      - name: boot headless collector
        # from the repo root (production shape; statics resolve there);
        # no timeout cap — the readiness loop below bounds the wait, and
        # the kill step reaps the process.
        run: python3 collector/speculum.py --port 8792 &
      - name: collector readiness and API smoke
        run: |
          set -euo pipefail
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:8792/api/snapshot >/dev/null && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:8792/api/snapshot | python3 -m json.tool
          tmp=$(mktemp)
          timeout 2 curl -sN http://127.0.0.1:8792/api/stream > "$tmp" || true
          head -n 2 "$tmp"
          rm -f "$tmp"
      - name: ui primitives and ripple state machine
        run: node smoke/ui-primitives.mjs
      - name: app shell and view model
        run: node smoke/shell.mjs
      - name: stop headless collector
        if: always()
        run: kill $(lsof -t -i :8792) 2>/dev/null || true

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: collector suite (Win32 ctypes backend runs here)
        shell: bash
        run: python3 -m unittest discover -s collector -p "test_*.py"
