name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: collector parses
        run: python3 -m py_compile collector/*.py
      - name: collector suite
        run: python3 -m unittest discover -s collector -p "test_*.py"
      - name: ui primitives and ripple state machine
        run: node smoke/ui-primitives.mjs
      - name: app shell and view model
        run: node smoke/shell.mjs
      - name: collector boots and serves (headless)
        run: |
          set -euo pipefail
          python3 collector/speculum.py --port 18792 &
          pid=$!
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:18792/api/snapshot >/dev/null && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:18792/api/snapshot | python3 -m json.tool | head
          curl -sN -m 2 http://127.0.0.1:18792/api/stream | head
          kill "$pid"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: collector suite (Win32 ctypes backend runs here)
        shell: bash
        run: python3 -m unittest discover -s collector -p "test_*.py"
